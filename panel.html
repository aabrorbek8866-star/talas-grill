<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Talas Grill Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky header with live rates, role tab strip, content in responsive card grid */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#17202a; --muted:#5b6673; --line:#d6dce3;
  --accent:#d9480f; --accent-soft:#fde4d6; --accent-ink:#ffffff;
  --ok:#2b8a3e; --ok-soft:#dcf3e1; --warn:#b35c00; --warn-soft:#fff0d6; --bad:#c92a2a; --bad-soft:#fde2e2;
  --cool:#1c6fc2; --cool-soft:#dcebfb;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a212a; --surface2:#151b22; --ink:#e8edf2; --muted:#94a0ad; --line:#2c3540;
  --accent:#ff7a3d; --accent-soft:#3a2418; --accent-ink:#1a0d05;
  --ok:#5fd17a; --ok-soft:#18301f; --warn:#ffc04d; --warn-soft:#33280f; --bad:#ff7070; --bad-soft:#3a1a1a;
  --cool:#5aaef7; --cool-soft:#15283b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a212a; --surface2:#151b22; --ink:#e8edf2; --muted:#94a0ad; --line:#2c3540;
  --accent:#ff7a3d; --accent-soft:#3a2418; --accent-ink:#1a0d05;
  --ok:#5fd17a; --ok-soft:#18301f; --warn:#ffc04d; --warn-soft:#33280f; --bad:#ff7070; --bad-soft:#3a1a1a;
  --cool:#5aaef7; --cool-soft:#15283b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h2{font-size:1.05rem}
h3{font-size:.9rem;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:1rem;white-space:nowrap}
.brand .who{font-size:.8rem;color:var(--muted)}
.rates{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.82rem}
.rate{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:.8rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.clock{font-family:var(--f-display);font-size:.95rem}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid transparent;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}

main{padding-block:18px 60px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:420px){.c3{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.kpi .s{font-size:.82rem;color:var(--muted)}
.stripe-ok{box-shadow:inset 4px 0 0 var(--ok)}.stripe-warn{box-shadow:inset 4px 0 0 var(--warn)}.stripe-bad{box-shadow:inset 4px 0 0 var(--bad)}.stripe-acc{box-shadow:inset 4px 0 0 var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface2);padding:9px 14px;border-radius:10px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn.big{padding:14px 18px;font-size:1.05rem;width:100%}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.field input,.field select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-weight:600;font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:800;white-space:nowrap}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.acc{background:var(--cool-soft);color:var(--cool)}
.chip.ready{background:var(--ok-soft);color:var(--ok)}
.chip.done{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .t{font-weight:800;min-width:46px}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* POS */
.pos-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pos-item:first-child{border-top:0}
.pos-item .nm{font-weight:800}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:44px;height:44px;font-size:1.3rem;font-weight:800}
.step input{width:54px;height:44px;border:0;text-align:center;background:var(--surface);font-weight:800;font-size:1.05rem}
.pos-item .lt{min-width:90px;text-align:right;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px}
.total .v{font-family:var(--f-display);font-size:1.7rem}
.conv{display:flex;gap:8px;flex-wrap:wrap}

/* tandoor */
.dur{display:flex;gap:6px;flex-wrap:wrap}
.dur button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 0;width:48px;font-weight:800}
.dur button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.batch{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface2)}
.batch.hot{border-color:var(--warn);background:var(--warn-soft)}
.batch.over{border-color:var(--bad);background:var(--bad-soft)}
.ring{width:96px;height:96px}
.ring text{font-family:var(--f-display);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .card{width:min(420px,100%);padding:26px;gap:16px}
.login .mark{width:52px;height:52px;border-radius:14px}
.login .mark svg{width:32px;height:32px}
.hint{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem}

/* overlay + toast */
.alarm{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bad) 30%,transparent);display:grid;place-items:center;padding:20px}
.alarm .box{background:var(--surface);border:3px solid var(--bad);border-radius:18px;padding:26px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;animation:pulse 1s ease-in-out infinite alternate}
.alarm .box h2{font-size:1.5rem;color:var(--bad)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.alarm .box{animation:none}}
.toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:40;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:520px;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast.err{background:var(--bad);color:#fff}
.langsel{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 8px;font-size:.8rem;font-weight:700}
textarea{width:100%}
.pw{position:relative}.pw input{padding-right:46px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:40px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:8px}.pw button:hover{color:var(--ink)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-weight:600}
</style>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

const KEYS = ["sales", "orders", "wages", "checkins", "batches", "stockIn", "pickups", "messages", "expenses", "incomes", "woodIn", "woodUse", "rewards", "losses"];
function collect(date) {
  const o = {}; KEYS.forEach(k => o[k] = []);
  for (const [id, l] of S.logs) {
    if (date && l.date !== date) continue;
    for (const k of KEYS) for (const x of (l[k] || [])) o[k].push({ ...x, date: l.date, by: l.role, doc: id });
  }
  for (const k of KEYS) o[k].sort((a, b) => a.t - b.t);
  return o;
}
function orderStatus() {
  const m = {};
  for (const l of S.logs.values()) for (const [id, v] of Object.entries(l.orderStatus || {})) if (!m[id] || v.t > m[id].t) m[id] = v;
  return m;
}
function decisions() {
  const m = {};
  for (const l of S.logs.values()) for (const [id, v] of Object.entries(l.decisions || {})) if (!m[id] || v.t > m[id].t) m[id] = v;
  return m;
}

const LOSS_REASONS = ["Kuygan tovuq", "Kassa kamomadi", "Yo'qolgan tovuq", "Buzilgan mahsulot", "Boshqa"];
function lossList(date) {
  const c = collect(date), dec = decisions(), price = cfg().prices.grill;
  const out = [];
  for (const b of c.batches) if (b.doneAt && outQty(b) < b.qty) { const q = b.qty - outQty(b); const pr = b.lossPrice ?? price; out.push({ id: "b-" + b.id, auto: true, t: b.doneAt, date: b.date, who: "oshpaz", reason: "Kuygan tovuq", qty: q, amount: q * pr }); }
  for (const x of c.losses) out.push({ ...x });
  out.forEach(x => { x.waived = dec["loss:" + x.id]?.s === "waived"; });
  return out.sort((a, b) => b.t - a.t);
}
const lossSum = (list, who) => sum(list.filter(x => !x.waived && (!who || x.who === who)), x => x.amount);
const EXP_CATS = ["Tovuq xaridi", "O'tin", "Lavash va non", "Sous va ziravorlar", "Ijara", "Kommunal (svet, gaz, suv)", "Transport", "Oshpaz ish haqi", "Boshqa"];
const outQty = b => b.outQty ?? b.qty;
function dayStats(date) {
  const c = collect(date);
  const done = c.batches.filter(b => b.doneAt);
  const cooked = sum(done, outQty);
  const sold = sum(c.sales, s => s.items.grill);
  return {
    c, cooked, sold, revenue: sum(c.sales, s => s.total),
    cooking: c.batches.filter(b => !b.doneAt), cookingQty: sum(c.batches.filter(b => !b.doneAt), b => b.qty),
    used: sum(c.batches, b => b.qty), stockIn: sum(c.stockIn, s => s.qty),
    extras: { lavash: sum(c.sales, s => s.items.lavash), non: sum(c.sales, s => s.items.non), sous: sum(c.sales, s => s.items.sous) },
    left: cooked - sold, checkin: c.checkins[0],
    sellerWage: sum(c.wages.filter(w => w.who === "kassir"), w => w.amount),
    pickups: sum(c.pickups, p => p.amount),

}
function cashState() {
  const c = collect();
  const sales = sum(c.sales, s => s.total);
  const taken = sum(c.wages.filter(w => w.status === "taken"), w => w.amount);
  const later = sum(c.wages.filter(w => w.status === "later"), w => w.amount);
  const picked = sum(c.pickups, p => p.amount);
  const dec = decisions();
  const expK = sum(c.expenses.filter(e => e.fromKassa), e => e.amount);
  const incK = sum(c.incomes.filter(e => e.toKassa), e => e.amount);
  const avansK = sum(c.messages.filter(m => m.type === "avans" && dec[m.id]?.s === "paidKassa"), m => m.amount);
  const rewK = sum(c.rewards.filter(r => r.fromKassa), r => r.amount);
  const box = sales + incK - taken - picked - expK - avansK - rewK;
  return { sales, taken, later, picked, expK, incK, avansK, rewK, box, net: box - later, c, dec };
}

let AC = null;
document.addEventListener("pointerdown", () => { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} }, { capture: true });
function beep(times = 3) {
  if (!AC) return;
  for (let i = 0; i < times; i++) {
    const o = AC.createOscillator(), g = AC.createGain(); const tt = AC.currentTime + i * 0.35;
    o.type = "square"; o.frequency.value = i % 2 ? 880 : 1175; g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(0.25, tt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.28);
    o.connect(g).connect(AC.destination); o.start(tt); o.stop(tt + 0.3);
  }
}

let alarmLoop = null; const alarmQueue = [];
function alarm(title, text) {
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
  try { if (window.Notification && Notification.permission === "granted") new Notification(title, { body: text }); } catch (e) {}
  alarmQueue.push([title, text, Date.now()]);
  let ov = $("#alarm");
  if (!ov) { ov = document.createElement("div"); ov.id = "alarm"; ov.className = "alarm"; document.body.appendChild(ov); }
  const [h, p] = alarmQueue[alarmQueue.length - 1];
  const older = alarmQueue.slice(0, -1).reverse();
  ov.innerHTML = `<div class="box" role="alertdialog" aria-labelledby="al-h"><div class="label">${esc(t("Eslatma"))}</div><h2 id="al-h"></h2><p id="al-p" style="margin:0;font-size:1.05rem"></p>
    ${older.length ? `<div class="list small" style="text-align:left">${older.map(([a, b, tm]) => `<div class="li"><span class="t">${hm(tm)}</span><span style="flex:1">${esc(a)}: ${esc(b)}</span></div>`).join("")}</div>` : ""}
    <button class="btn primary big" id="al-ok">${esc(t("Ko'rdim"))}</button></div>`;
  $("#al-h", ov).textContent = h; $("#al-p", ov).textContent = p;
  beep(4); clearInterval(alarmLoop); let n = 0;
  alarmLoop = setInterval(() => { beep(4); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} if (++n > 30) clearInterval(alarmLoop); }, 2500);
  $("#al-ok", ov).onclick = () => { clearInterval(alarmLoop); alarmQueue.length = 0; ov.remove(); };
}
const alerted = new Set(ls("tg_alerted") || []);
const once = key => { if (alerted.has(key)) return false; alerted.add(key); ls("tg_alerted", [...alerted].slice(-400)); return true; };
const isCook = () => S.session && ["oshpaz", "admin"].includes(S.session.role);
const isSeller = () => S.session && ["kassir", "admin"].includes(S.session.role);
const isBoss = () => S.session && ["direktor", "admin"].includes(S.session.role);
function checkAlarms() {
  if (!S.session || !S.loaded.logs) return;
  const now = Date.now();
  if ((isCook() || isBoss()) && S.wood && S.wood.updatedAt && woodCount() <= cfg().woodLow && once(`wood:${dkey()}:${woodCount()}`)) {
    alarm(t("O'tin kam qoldi"), t("Omborda {0} {1} o'tin qoldi. Yangi o'tin keltirish kerak.", woodCount(), t(cfg().woodUnit)));
  }
  if (isCook()) {
    /* 1) tandir taymeri: 10 va 5 daqiqa qolganda, vaqt tugaganda */
    for (const b of collect().batches.filter(b => !b.doneAt)) {
      const end = b.t + b.dur * 60000, rem = end - now;
      const marks = [[0, t("Vaqt tugadi! Tandirdan chiqaring"), t("{0} ta tovuq pishish vaqti tugadi (soat {1}). Darhol tekshiring.", b.qty, hm(end))],
                     [5, t("5 daqiqa qoldi"), t("Tandirga qarang, kuymadimi? {0} ta tovuq soat {1} da tayyor bo'ladi.", b.qty, hm(end))],
                     [10, t("10 daqiqa qoldi"), t("Tandirga qarang, kuymadimi? {0} ta tovuq soat {1} da tayyor bo'ladi.", b.qty, hm(end))]];
      for (const [m, title, txt] of marks) {
        if (rem <= m * 60000 && !alerted.has(b.id + ":" + m)) {
          marks.forEach(([mm]) => { if (mm >= m) once(b.id + ":" + mm); });
          if (!(m === 0 && rem < -10 * 60000)) alarm(title, txt);
          break;
        }
      }
    }
    const c = cfg(), today = dkey(), ds = dayStats(today), st = orderStatus();
    const avail = Math.max(0, ds.left);
    /* 2) buyurtma vaqtidan 40 daqiqa oldin */
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    for (const o of ds.c.orders) {
      if (["ready", "given"].includes(st[o.id]?.s)) continue;
      const [h, m] = o.ready.split(":").map(Number); const at = d0.getTime() + (h * 60 + m) * 60000;
      if (now >= at - c.orderLead * 60000 && now < at + 30 * 60000 && once("lead:" + o.id)) {
        alarm(t("Buyurtma uchun tovuq pishiring"), t("Soat {0} ga {1} ta grill kerak ({2} daqiqa qoldi). Sotish uchun tayyor turganlar: {3} ta. Bu buyurtma uchun alohida pishiring.", o.ready, o.qty, Math.max(0, Math.round((at - now) / 60000)), avail) + (o.note ? " · " + o.note : ""));
      }
    }
    /* 3) sotish uchun grill kam qoldi */
    if (ds.cooked > 0 && avail + ds.cookingQty <= c.lowStock && once(`low:${today}:${ds.cooked}`)) {
      alarm(t("Sotish uchun grill kam qoldi"), t("Vitrinada {0} ta grill qoldi, tandirda {1} ta. Yangi partiya qo'ying.", avail, ds.cookingQty));
    }
    /* 4) omborda muzlatilgan tovuq kam */
    if (S.stock && S.stock.updatedAt && stockCount() < c.perTandoor && once(`frozen:${today}:${stockCount()}`)) {
      alarm(t("Omborda tovuq kam"), t("Omborda {0} ta muzlatilgan tovuq qoldi. Bitta tandirga {1} ta kerak.", stockCount(), c.perTandoor));
    }
  }
}

/* ---------- live notifications on data change ---------- */
let seenOrders = null, seenReady = null, seenMsgs = null, seenDec = null, seenRew = null, seenLoss = null;
function watchChanges() {
  if (!S.session || !S.loaded.logs) return;
  const c = collect(dkey()); const st = orderStatus();
  const ids = new Set(c.orders.map(o => o.id));
  const readyIds = new Set(c.orders.filter(o => st[o.id]?.s === "ready").map(o => o.id));
  if (seenOrders && isCook()) {
    for (const o of c.orders) if (!seenOrders.has(o.id) && S.session.role !== "admin" || (!seenOrders.has(o.id) && S.session.role === "admin")) {
      if (once("new:" + o.id)) alarm(t("Yangi buyurtma"), t("{0} ta grill, soat {1} ga tayyor bo'lsin.", o.qty, o.ready) + (o.note ? " · " + o.note : ""));
    }
  }
  if (seenReady && isSeller()) {
    for (const o of c.orders) if (readyIds.has(o.id) && !seenReady.has(o.id) && once("rdy:" + o.id)) alarm(t("Buyurtma tayyor"), t("{0} ta grill (soat {1}) tayyor. Kassaga olib, mijozga bering.", o.qty, o.ready));
  }
  const all = collect(); const dec = decisions();
  const msgIds = new Set(all.messages.map(m => m.id));
  if (seenMsgs && isBoss()) for (const m of all.messages) if (!seenMsgs.has(m.id) && once("msg:" + m.id)) {
    alarm(m.type === "avans" ? t("Avans so'rovi") : t("Yangi xabar"), `${t(ROLES[m.by] || m.by)}: ` + (m.type === "avans" ? money(m.amount) + (m.text ? " · " + m.text : "") : m.text));
  }
  const mine = all.messages.filter(m => m.by === S.session.role);
  const decIds = new Set(mine.filter(m => dec[m.id]).map(m => m.id + dec[m.id].s));
  if (seenDec) for (const m of mine) { const d = dec[m.id]; if (d && !seenDec.has(m.id + d.s) && once("dec:" + m.id + d.s)) alarm(t("Direktor javob berdi"), decText(m, d)); }
  const rewIds = new Set(all.rewards.map(r => r.id));
  if (seenRew) for (const r of all.rewards) if (r.who === S.session.role && !seenRew.has(r.id) && once("rew:" + r.id)) alarm(r.kind === "bonus" ? t("Sizga bonus berildi") : t("Sizga premiya berildi"), money(r.amount) + (r.note ? " · " + r.note : ""));
  const ll = lossList(); const lossIds = new Set(ll.map(x => x.id));
  if (seenLoss) for (const x of ll) if (!seenLoss.has(x.id) && (x.who === S.session.role || isBoss()) && once("loss:" + x.id)) alarm(t("Kamomad yozildi"), `${t(ROLES[x.who])}: ${t(x.reason)}${x.qty ? " · " + t("{0} ta", x.qty) : ""} · ${t("{0} oylikdan ushlanadi", money(x.amount))}`);
  seenOrders = ids; seenReady = readyIds; seenMsgs = msgIds; seenDec = decIds; seenRew = rewIds; seenLoss = lossIds;
}

async function refreshRates(manual) {
  if (!S.mcp) { if (manual) toast(t("Avtomatik kurs bu qurilmada mavjud emas. Kursni qo'lda kiriting."), "err"); return; }
  try {
    const get = async sym => {
      const r = await S.mcp.callTool("Twelve Data", "currency_conversion", { symbol: sym }, { cache: false });
      const p = r.payload; const txt = typeof p === "string" ? p : (p && (p.result || p.rate)) ? String(p.result ?? p.rate) : JSON.stringify(p);
      const m = txt.match(/;([\d.]+);/) || txt.match(/([\d]+\.[\d]+)/); if (!m) throw new Error("parse");
      return Number(m[1]);
    };
    const usdKgs = await get("USD/KGS"), usdUzs = await get("USD/UZS");
    if (!(usdKgs > 0 && usdUzs > 0)) throw new Error("bad");
    S.rates = { usdKgs, usdUzs, updatedAt: Date.now(), source: "Twelve Data" }; refresh();
    await writeMeta("rates", S.rates);
    if (manual) toast(t("Kurs yangilandi"));
  } catch (e) { console.warn(e); if (manual) toast(t("Kursni olib bo'lmadi. Qo'lda kiriting."), "err"); }
}

function updTimer(el) {
  const b = collect().batches.find(x => x.id === el.dataset.timer); if (!b) return;
  const end = b.t + b.dur * 60000, rem = end - Date.now(), total = b.dur * 60000;
  const frac = Math.max(0, Math.min(1, 1 - rem / total));
  const mm = Math.floor(Math.abs(rem) / 60000), ss = Math.floor(Math.abs(rem) % 60000 / 1000);
  const tx = $("text", el); if (tx) tx.textContent = (rem < 0 ? "+" : "") + pad(mm) + ":" + pad(ss);
  const arc = $(".arc", el); if (arc) arc.setAttribute("stroke-dasharray", `${(frac * 263.9).toFixed(1)} 263.9`);
  const card = el.closest(".batch"); if (card) { card.classList.toggle("hot", rem <= 10 * 60000 && rem > 0); card.classList.toggle("over", rem <= 0); }
}

function barChart(days, series, opts = {}) {
  const W = 640, H = 220, Lp = 40, R = 8, T = 12, B = 34;
  const max = Math.max(1, ...days.map(d => Math.max(...series.map(s => s.get(d)))));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = Math.ceil(max / step) * step;
  const cw = (W - Lp - R) / days.length, bw = Math.max(3, Math.min(18, (cw - 6) / series.length));
  const y = v => T + (H - T - B) * (1 - v / nice);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; g += `<line x1="${Lp}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${Lp - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`; }
  days.forEach((d, i) => {
    const cx = Lp + cw * i + cw / 2, x0 = cx - (bw * series.length) / 2;
    series.forEach((s, j) => { const v = s.get(d); g += `<rect x="${(x0 + j * bw).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${(y(0) - y(v)).toFixed(1)}" rx="2" fill="${s.color}"><title>${dayLabel(d)} · ${esc(s.name)}: ${fmt(v)}</title></rect>`; });
    if (days.length <= 14 || i % Math.ceil(days.length / 10) === 0) g += `<text x="${cx}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">${dayLabel(d)}</text>` + (days.length <= 14 ? `<text x="${cx}" y="${H - B + 26}" text-anchor="middle" font-size="9" fill="var(--muted)">${wd(d)}</text>` : "");
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">${g}</svg></div><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

  bind(root) {

/* ANALITIKA */
VIEWS.analitika = {
  html: () => `<div class="grid"><div class="card c12"><div class="card-h"><h2>${E("Analitika")}</h2><div class="seg" role="group">${[7, 14, 30].map(n => `<button data-range="${n}">${esc(t("{0} kun", n))}</button>`).join("")}</div></div><div class="grid" id="a-kpi"></div></div>
    <div class="card c7"><h2>${E("Pishirilgan va sotilgan grillar")}</h2><div id="a-ch1"></div></div>
    <div class="card c5" id="a-revcard"><h2>${E("Kunlik tushum")}</h2><div id="a-ch2"></div></div>
    <div class="card c12"><h2>${E("Kunlar jadvali")}</h2><div class="tbl-wrap"><table><thead id="a-th"></thead><tbody id="a-tbl"></tbody></table></div></div></div>`,
  bind(root) {
    const set = () => $$("[data-range]", root).forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.range) === S.range));
    $$("[data-range]", root).forEach(b => b.onclick = () => { S.range = Number(b.dataset.range); set(); this.update(root); }); set();
  },
  update(root) {
    const showMoney = S.session.role !== "oshpaz";
    const days = daysBack(S.range); const stats = {}; days.forEach(d => stats[d] = dayStats(d));
    const tc = sum(days, d => stats[d].cooked), ts = sum(days, d => stats[d].sold), tr = sum(days, d => stats[d].revenue);
    const active = days.filter(d => stats[d].cooked || stats[d].sold).length || 1;
    const r = cfg().cookRate;
    $("#a-kpi", root).innerHTML = kpi(E("Pishirildi"), esc(t("{0} ta", tc)), esc(t("O'rtacha {0} ta/kun", Math.round(tc / active))), "stripe-acc") + kpi(E("Sotildi"), esc(t("{0} ta", ts)), esc(t("Farq: {0}", tc - ts))) +
      (showMoney ? kpi(E("Tushum"), money(tr), moneyAll(tr)) : "") + kpi(E("Oshpaz ish haqi"), money(tc * r), `${tc} × ${r} KGS`) + (showMoney ? kpi(E("Sotuvchi oyligi"), money(sum(days, d => stats[d].sellerWage)), esc(t("{0} kun", days.filter(d => stats[d].sellerWage).length))) : "");
    $("#a-ch1", root).innerHTML = barChart(days, [{ name: t("Pishirildi"), color: "var(--accent)", get: d => stats[d].cooked }, { name: t("Sotildi"), color: "var(--cool)", get: d => stats[d].sold }], { label: t("Pishirilgan va sotilgan grillar") });
    $("#a-revcard", root).hidden = !showMoney;
    if (showMoney) $("#a-ch2", root).innerHTML = barChart(days, [{ name: t("Tushum") + ", KGS", color: "var(--ok)", get: d => stats[d].revenue }], { label: t("Kunlik tushum") });
    $("#a-th", root).innerHTML = `<tr><th>${E("Sana")}</th><th>${E("Pishirildi")}</th><th>${E("Sotildi")}</th><th>${E("Farq")}</th>${showMoney ? `<th>${E("Tushum")}</th><th>${E("Sotuvchi keldi")}</th>` : ""}</tr>`;
    $("#a-tbl", root).innerHTML = days.slice().reverse().map(d => { const s = stats[d]; return `<tr><td>${dayLabel(d)} ${wd(d)}</td><td>${s.cooked || "—"}</td><td>${s.sold || "—"}</td><td>${s.cooked || s.sold ? (s.left > 0 ? "+" : "") + s.left : "—"}</td>${showMoney ? `<td>${s.revenue ? money(s.revenue) : "—"}</td><td>${s.checkin ? hm(s.checkin.t) : "—"}</td>` : ""}</tr>`; }).join("");
  },
};

/* JURNAL */
VIEWS.jurnal = {
  html: () => `<div class="grid"><div class="card c12"><div class="card-h"><h2>${E("Kun jurnali")}</h2><div class="row"><label class="label" for="j-date">${E("Sana")}</label><input id="j-date" type="date" style="border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface2)"></div></div><div id="j-sum" class="small muted"></div><div class="list" id="j-list"></div></div></div>`,
  bind(root) { const i = $("#j-date", root); i.value = S.jurnalDate; i.max = dkey(); i.onchange = () => { S.jurnalDate = i.value || dkey(); this.update(root); }; },
  update(root) {
    const d = S.jurnalDate, ds = dayStats(d), c = ds.c; const ev = [];
    c.checkins.forEach(x => ev.push([x.t, t("Sotuvchi ishga keldi"), ""]));
    c.sales.forEach(x => ev.push([x.t, t("Sotuv") + ": " + itemsText(x.items), money(x.total)]));
    c.orders.forEach(x => ev.push([x.t, t("Buyurtma: {0} ta, soat {1} ga", x.qty, x.ready) + (x.note ? " (" + x.note + ")" : ""), ""]));
    c.batches.forEach(x => { ev.push([x.t, t("Tandirga qo'yildi: {0} ta, {1} daqiqa", x.qty, x.dur), ""]); if (x.doneAt) ev.push([x.doneAt, t("Tandirdan chiqdi: {0} ta", outQty(x)), ""]); });
    c.stockIn.forEach(x => ev.push([x.t, t("Omborga kirim: {0} ta", x.qty), ""]));
    c.wages.forEach(x => ev.push([x.t, x.status === "taken" ? t("Sotuvchi oyligi (oldi)") : t("Sotuvchi oyligi (keyin oladi)"), "−" + money(x.amount)]));
    c.pickups.forEach(x => ev.push([x.t, t("Direktor kassadan oldi") + (x.note ? " (" + x.note + ")" : ""), "−" + money(x.amount)]));
    c.expenses.forEach(x => ev.push([x.t, t("Xarajat") + ": " + t(x.cat) + (x.note ? " (" + x.note + ")" : ""), "−" + money(x.amount)]));
    c.incomes.forEach(x => ev.push([x.t, t("Kirim") + (x.note ? " (" + x.note + ")" : ""), "+" + money(x.amount)]));
    c.woodIn.forEach(x => ev.push([x.t, t("O'tin keldi") + `: ${x.qty} ${t(cfg().woodUnit)}`, ""]));
    c.woodUse.forEach(x => ev.push([x.t, t("O'tin ishlatildi") + `: ${x.qty} ${t(cfg().woodUnit)}`, ""]));
    c.messages.forEach(x => ev.push([x.t, `${t(ROLES[x.by] || x.by)} → ${t("Direktor")}: ` + (x.type === "avans" ? t("Avans") + " " + money(x.amount) + " " : "") + (x.text || ""), ""]));
    lossList(d).forEach(x => ev.push([x.t, `${t("Kamomad")}: ${t(ROLES[x.who])} · ${t(x.reason)}${x.qty ? " · " + t("{0} ta", x.qty) : ""}${x.waived ? " (" + t("kechirildi") + ")" : ""}`, "−" + money(x.amount)]));
    c.rewards.forEach(x => ev.push([x.t, `${x.kind === "bonus" ? t("Bonus") : t("Premiya")} → ${t(ROLES[x.who])}`, money(x.amount)]));
    ev.sort((a, b) => a[0] - b[0]);
    $("#j-sum", root).textContent = t("Pishirildi {0} ta · Sotildi {1} ta · Tushum {2}", ds.cooked, ds.sold, money(ds.revenue));
    $("#j-list", root).innerHTML = ev.length ? ev.map(([tm, txt, v]) => `<div class="li"><span class="t">${hm(tm)}</span><span style="flex:1;min-width:0">${esc(txt)}</span><b>${v}</b></div>`).join("") : `<div class="empty">${E("Bu kunda yozuv yo'q.")}</div>`;
  },
};

VIEWS.kamomad = {

    ${isBoss() ? `<form class="card c5 stripe-bad" id="l-form" style="align-self:start"><h2>${E("Kamomad yozish")}</h2>

      <div class="field"><label class="label" for="l-reason">${E("Sababi")}</label><select id="l-reason">${LOSS_REASONS.map(r => `<option value="${esc(r)}">${E(r)}</option>`).join("")}</select></div></div>

  bind(root) {
    const f = $("#l-form", root);
    if (f) {
      const calc = () => { const q = Number($("#l-qty", root).value) || 0; if (q > 0 && document.activeElement !== $("#l-amt", root)) $("#l-amt", root).value = q * cfg().prices.grill; $("#l-hint", root).textContent = q > 0 ? t("{0} ta × {1} = {2}", q, money(cfg().prices.grill), money(q * cfg().prices.grill)) : ""; };
      $("#l-qty", root).oninput = calc;
      f.onsubmit = async e => {
        e.preventDefault(); const a = Math.round(Number($("#l-amt", root).value)); if (!(a > 0)) { $("#l-err", root).textContent = t("Summani kiriting."); return; } $("#l-err", root).textContent = "";
        const x = { id: uid(), t: Date.now(), who: $("#l-who", root).value, reason: $("#l-reason", root).value, qty: Math.round(Number($("#l-qty", root).value)) || 0, amount: a, note: $("#l-note", root).value.trim() };
        await mutateToday(l => push(l, "losses", x)); ["#l-qty", "#l-amt", "#l-note"].forEach(s => $(s, root).value = ""); $("#l-hint", root).textContent = ""; toast(t("Kamomad yozildi"));
      };
    }
    root.addEventListener("click", async e => {

    const all = lossList().filter(x => boss || x.who === me);
    const today = all.filter(x => x.date === dkey()), month = all.filter(x => x.date >= mStart);
    const burnt = sum(month.filter(x => !x.waived && x.reason === "Kuygan tovuq"), x => x.qty);
    $("#l-kpi", root).innerHTML = kpi(E("Bugun"), "−" + money(lossSum(today)), esc(t("{0} ta yozuv", today.filter(x => !x.waived).length)), lossSum(today) ? "stripe-bad" : "stripe-ok") +

      ${x.waived ? `<span class="chip ready">${E("kechirildi")}</span>` : `<b style="color:var(--bad)">−${money(x.amount)}</b>`}${boss ? `<button class="btn sm" data-waive="${x.id}" data-on="${x.waived ? 1 : 0}">${x.waived ? E("Qaytarish") : E("Kechirish")}</button>` : ""}</div>`).join("") : `<div class="empty">${E("Kamomad yo'q.")}</div>`;
  },
};

    P("oshpaz", "woodUse", { id: uid(), t: at(21, 0), qty: 1.5 });
    let cooked = 0; const batches = [];
    for (let m = 9 * 60; m < 20 * 60; m += ri(70, 90)) {
      const dur = ri(22, 28), tt = at(0, m), qty = 25, out = rnd() < 0.06 ? 24 : 25;
      if (tt > limit) break;
      const done = tt + dur * 60000 <= limit;
      const b = { id: uid(), t: tt, qty, dur, doneAt: done ? tt + dur * 60000 + 60000 : null, outQty: done ? out : undefined };
      if (!done) delete b.outQty;
      P("oshpaz", "batches", b); batches.push(b); if (done) cooked += out;
    }
    let sold = 0; let tm = 9 * 60 + 40;
    while (true) {
      tm += ri(3, 9); const tt = at(0, tm); if (tt > limit || tm > 21 * 60 + 30) break;
      const ready = sum(batches.filter(b => b.doneAt && b.doneAt <= tt), outQty);
      if (sold >= ready - 1) continue;
      const g = Math.min(ri(1, 3), ready - sold); if (g <= 0) continue;
      const items = { grill: g, lavash: rnd() < .45 ? ri(1, 3) : 0, non: rnd() < .35 ? ri(1, 2) : 0, sous: rnd() < .5 ? ri(1, 2) : 0 };
      const total = sum(ITEMS, ([kk]) => items[kk] * DEF.prices[kk]);
      P("kassir", "sales", { id: uid(), t: tt, items, prices: { ...DEF.prices }, total }); sold += g;
    }
    const orders = [[12, 0, 8, "Ofis uchun"], [15, 30, 5, ""], [19, 0, 12, "To'y uchun"]];
    orders.forEach(([h, m, q, n]) => { const id = uid(); P("kassir", "orders", { id, t: at(h - 2, m), qty: q, ready: `${pad(h)}:${pad(m)}`, note: n });
      if (at(h - 1, m) <= limit) (o.orderStatus = o.orderStatus || {})[id] = { s: at(h, m - 5) <= limit ? "ready" : "acc", t: Math.min(limit, at(h, m - 5)) };
      if (at(h, m + 5) <= limit) (k.orderStatus = k.orderStatus || {})[id] = { s: "given", t: at(h, m + 5) }; });
    if (!isToday || now > at(21, 0)) { P("kassir", "wages", { id: uid(), t: at(21, 10), who: "kassir", amount: 500, status: di % 5 === 2 ? "later" : "taken", takenAt: at(21, 10) }); }
    if (!isToday) { const rev = sum(k.sales || [], s => s.total); P("direktor", "pickups", { id: uid(), t: at(21, 40), amount: Math.round((rev - 500) / 100) * 100, note: "Kechki inkassatsiya" }); }
    if (di === 12) P("direktor", "losses", { id: "dl1", t: at(21, 45), who: "kassir", reason: "Kassa kamomadi", qty: 0, amount: 900, note: "Kechki hisobda 900 som kam chiqdi" });
    if (di === 10) { P("oshpaz", "messages", { id: "dm1", t: at(13, 0), type: "avans", text: "Uyga kerak", amount: 3000 }); (dr.decisions = dr.decisions || {}).dm1 = { s: "paidHand", t: at(14, 0), note: "Berdim" }; P("direktor", "rewards", { id: uid(), t: at(21, 50), who: "oshpaz", kind: "premiya", amount: 2000, note: "Haftada 1500 ta grill", fromKassa: false }); }
    if (isToday) { P("kassir", "messages", { id: "dm2", t: at(10, 15), type: "msg", text: "Lavash tugab qolyapti, ertaga ko'proq olib keling", amount: 0 }); P("oshpaz", "messages", { id: "dm3", t: at(11, 5), type: "avans", text: "", amount: 2500 }); }
    stock = stock + sum(o.stockIn || [], s => s.qty) - sum(batches, b => b.qty); wood = wood + sum(o.woodIn || [], w => w.qty) - sum(o.woodUse || [], w => w.qty);
  });
  st["meta/stock"] = { count: Math.max(0, stock), updatedAt: now };
  st["meta/wood"] = { amount: Math.max(0, Math.round(wood * 10) / 10), updatedAt: now };
  return st;
}
/* ---------- boot ---------- */
document.documentElement.lang = LANG;
renderLogin();
if (S.session) renderShell();
(async () => {
  const timer = setTimeout(() => { if (!S.loaded.settings) { S.dbFail = !S.db; updLoginHint(); toast(t("Ma'lumotlar hali yuklanmadi. Internet aloqasini tekshiring."), "err"); } }, 10000);
  const db = DEMO ? await makeDemoDb() : window.claude && await window.claude.use("db");
  if (!db) { S.dbFail = true; clearTimeout(timer); updLoginHint(); if (S.session) toast(t("Ma'lumotlar bazasiga ulanib bo'lmadi. claude.ai hisobingizga kirganingizni tekshiring va sahifani qayta oching."), "err"); return; }
  S.db = db;
  db.doc("meta/settings").onSnapshot(s => {
    S.settings = s.exists ? s.data() : null; if (!s.metadata.fromCache) { S.loaded.settings = true; clearTimeout(timer); }
    if (S.session && S.settings && !(S.settings.users || {})[S.session.login]) { ls("tg_session", null); S.session = null; renderLogin(t("Sessiya tugadi, qayta kiring.")); return; }
    refresh();
  }, e => { console.error(e); S.dbFail = true; updLoginHint(); });
  db.doc("meta/rates").onSnapshot(s => { S.rates = s.exists ? s.data() : null; refresh(); }, e => console.error(e));
  db.doc("meta/stock").onSnapshot(s => { S.stock = s.exists ? s.data() : { count: 0 }; refresh(); }, e => console.error(e));
  db.doc("meta/wood").onSnapshot(s => { S.wood = s.exists ? s.data() : { amount: 0 }; refresh(); }, e => console.error(e));
  const since = dkey(new Date(Date.now() - 90 * DAY));
  db.collection("log").where("date", ">=", since).onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, d.data())); S.logs = m; S.loaded.logs = true; refresh();
  }, e => { console.error(e); toast(t("Ma'lumotlarni o'qib bo'lmadi."), "err"); });
  if (DEMO) return;
  try {
    S.mcp = await window.claude.use("mcp");
    const user = await window.claude.use("user");
    const owner = user ? ((await user.isOwner()) ?? false) : false;
    if (S.mcp && owner) setTimeout(() => { if (!S.rates || Date.now() - (S.rates.updatedAt || 0) > 3600e3) refreshRates(false); }, 4000);
    if (S.mcp && owner) setInterval(() => { if (S.rates && Date.now() - (S.rates.updatedAt || 0) > 3600e3) refreshRates(false); }, 600e3);
  } catch (e) {}
})();
})();
